# ПРИМЕР-ШАБЛОН списка лидеров мнений в X (Twitter) для разведки Скаута, по трекам.
# Скопируй в leaders.yaml и впиши реальные хэндлы (без @, как в x.com/<handle>).
# leaders.yaml -> .gitignore (личная кухня, в публичный репо не идёт);
# без него код падает на этот пример (read.py: фолбэк на .example).
#
# Это ПЕРВИЧНЫЕ голоса (Тир-1/2 по скорости): тезис появляется РАНЬШЕ блога/RSS,
# а X не индексируется веб-поиском — поэтому дип-ресёрч их не видит. Это эдж Скаута.
# Аккаунты НЕ авторитетны автоматически: Скаут всё равно проверяет на гем, красные
# линии и прослеживание цифр к первоисточнику.
#
# ПОРЯДОК ВАЖЕН: по умолчанию scan_x читает верхние ~12 (max_accounts) — держи
# самых сильных вверху. Ниже — «скамейка» для глубоких/точечных сканов.
crypto:
  - example_macro_analyst       # напр. макро/ликвидность
  - example_onchain_research    # напр. ончейн-аналитика
  - example_research_fund       # напр. ресёрч-дом/фонд
  - example_founder             # напр. фаундер инфраструктуры
  - example_news_signal         # напр. быстрый новостной сигнал
ai:
  - example_ai_x_crypto         # напр. мост AI × крипта
  - example_frontier_ai         # напр. фронтир-AI (направление тренда)

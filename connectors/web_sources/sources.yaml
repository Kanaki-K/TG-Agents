# RSS-фиды по трекам. Референс-ядро, не закрытый список: Скаут калибруется на нём и
# ищет глубже сам. Подробности/тиры — в memory/sources.md.
#
# ЯДРО (Тир-2, проверены WebFetch) — медленная мысль/тезисы. НЕ трогать без причины.
# РАСШИРЕНИЕ (быстрые новости / ресёрч / первоисточники) — добавлено для широты и свежести.
#   Эти URL НЕ провалидированы в контейнере (нет сети) — проверь первым прогоном refresh:
#   битый фид не роняет скан, только строка «⚠ фид не прочитан» (feeds.py изолирует сбой).
#   Что не читается — правь URL или удаляй.
crypto:
  # — ядро: тезис/макро/ончейн (медленное, глубокое) —
  - name: Lyn Alden
    url: https://www.lynalden.com/feed/
  - name: Arthur Hayes
    url: https://cryptohayes.substack.com/feed
  - name: Glassnode Research
    url: https://research.glassnode.com/rss/

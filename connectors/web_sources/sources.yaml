  - name: Decrypt
    url: https://decrypt.co/feed
  - name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
  - name: Blockworks
    url: https://blockworks.co/feed
  # — расширение: тезис/ресёрч (угол, не пересказ) —
  - name: Bankless
    url: https://www.bankless.com/rss/feed
  - name: The Defiant
    url: https://thedefiant.io/api/feed
  # — расширение: первоисточники (анонсы раньше пересказчиков) —
  - name: a16z crypto
    url: https://a16zcrypto.com/feed/
  - name: Ethereum Foundation
    url: https://blog.ethereum.org/en/feed.xml

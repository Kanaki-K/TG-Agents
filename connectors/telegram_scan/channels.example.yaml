# ПРИМЕР-ШАБЛОН списка ТГ-каналов для разведки Скаута, по трекам.
# Скопируй в channels.yaml и впиши реальные каналы, которые читаешь.
# channels.yaml -> .gitignore (личная кухня, в публичный репо не идёт);
# без него код падает на этот пример (read.py: фолбэк на .example).
#
# «Норм», но НЕ авторитетные — Скаут проверяет достоверность и прослеживание к Тир-1/2.
# Первые в каждом списке — те, что реально читаешь.
crypto:
  - "@example_crypto_channel_1"
  - "@example_crypto_channel_2"
  - "@example_crypto_channel_3"
ai:
  - "@example_ai_channel_1"
  - "@example_ai_channel_2"
  - "@example_ai_channel_3"

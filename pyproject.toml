# Конфиг инструментов (не пакетуем проект — только [tool.*]). Добавлен 17.07 по аудиту:
# статичный линтер ловит классы «тихих» багов, которых не видно в работе (неопределённые имена,
# мёртвые импорты/переменные) — ровно то, чего боится владелец.
[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Старт — ЛОВЦЫ РЕАЛЬНЫХ БАГОВ, не стиль: pyflakes (F — неопределённые имена F821, неиспользуемые
# импорты F401 и переменные F841, f-string без плейсхолдера) + синтаксис (E9). Низкий шум,
# высокая ценность. Шаг CI пока НЕблокирующий; расширять набор и делать блокирующим — по мере чистки.
select = ["F", "E9"]

# Тесты — только tests/ (аудит 29.09): иначе pytest собирает connectors/gpt_image/test_render.py —
# это не тест, а ручной запуск РЕАЛЬНОЙ генерации обложки через браузер.
[tool.pytest.ini_options]
testpaths = ["tests"]

# CI: гоняет тот же тест-набор, что и владелец локально (python -m pytest), при каждом push/PR.
# Цель — авто-страховка: красный крест на коммите = что-то сломалось, не запуская руками (AUDIT P2-12).
# Тесты чистые (без API/сети/секретов), .env не нужен: секреты на уровне модуля читаются только через
# get_optional (не падает), а get_secret — лениво внутри функций, которые юнит-тесты не дёргают.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies (exact lock — как на рабочей машине)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      # Статичный линтер (аудит 17.07): ловит тихие баги — неопределённые имена, мёртвые импорты/
      # переменные (набор F+E9, конфиг в pyproject.toml). НЕ роняет сборку — сигнал, а не шлагбаум,
      # как pip-audit ниже: пока чистим, потом сделаем блокирующим. Смотрим лог при жёлтой отметке.
      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      # CVE-скан зависимостей (аудит 15.07: транзитивный js2py через twikit несёт известный
      # sandbox-escape CVE-2024-28397). НЕ роняет сборку — сигнал, а не шлагбаум: править пины
      # решает владелец. Смотрим лог шага при жёлтой отметке.
      - name: Audit dependencies for known CVEs (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          python -m pip_audit -r requirements.lock --desc
